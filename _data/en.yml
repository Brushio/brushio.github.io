# Support page (/support/). Перевод украинских текстов из _data/uk.yml.
# ---------------------------------------------------------------------------
support:
  heading: "Support"
  lead: "Have a question or something isn't working? Write to us - we read every message."
  button: "Contact us"
  details_title: "To help us help you faster, please include:"
  details:
    - "your iPhone or Apple Watch model and iOS / watchOS version;"
    - "your Brushio version (Settings → About → Version);"
    - "what happened and how to reproduce it;"
    - "a screenshot, if possible."
  faq_title: "Common issues"
  faq:
    - q: "My data doesn't sync between devices"
      a: "Open Settings → About → iCloud Sync in Brushio to see the sync status. If there's an error, tap the row and Brushio will show the reason. Make sure all your devices are signed in to the same Apple Account, your iCloud storage isn't full and you're online."
    - q: "How do I restore my Brushio Pro purchase?"
      a: "In Brushio, open Settings → Brushio Pro and tap Restore. Use the same Apple Account you made the purchase with."
    - q: "Reminders don't arrive"
      a: "Check that reminders are turned on in Brushio under Settings → Reminders → Manage Reminders, and that notifications are allowed in the Settings app on your iPhone → Notifications → Brushio. A Focus mode can also hide them."
    - q: "Brushing sessions don't appear in Health"
      a: "Turn on Apple Health in Brushio under Settings → Preferences. Then open your profile in the Health app and check that Brushio has access. Brushio only writes brushing sessions and never reads anything."
    - q: "How do I change the app language?"
      a: "In Brushio, go to Settings → Preferences → Language. This opens the Settings app on your iPhone, where you can choose a language just for Brushio."
    - q: "How do I cancel my subscription?"
      a: "Open the Settings app on your iPhone → your name → Subscriptions → Brushio. A lifetime purchase never needs to be canceled."
    - q: "How do I delete all my data?"
      a: "You can delete individual records in the app. To delete everything, delete Brushio from your iPhone, then remove its data from iCloud: Settings → your name → iCloud → Manage Account Storage → Brushio."
  more_before: "More answers in the"
  more_link: "FAQ"
  more_after: "on the home page."
