# Тексты лендинга на английском.
# В текстах - короткий дефис «-», не длинное тире.

language_name: "English"

meta:
  title: "Brushio - Smart Toothbrushing Timer and Dental Care"
  description: "Brush properly with a guided timer, keep your streak, track every dentist visit tooth by tooth and know when to replace your toothbrush. For iPhone and Apple Watch."

app_store_button: "Download on the App Store"

faq:
  title: "Questions and answers"
  items:
    - q: "Do I need an account?"
      a: "No. Brushio works without any registration. Your data is tied to your Apple Account through iCloud, which you already use."
    - q: "Where is my data stored?"
      a: "On your devices and in your private iCloud. Brushio has no servers, so the developer has no access to your data."
    - q: "What does Brushio do with Apple Health?"
      a: "It only writes your toothbrushing sessions to Apple Health if you allow it. It never reads any health data."
    - q: "Does it work on Apple Watch?"
      a: "Yes. You can start and follow a brushing session right from your wrist. The Watch app needs watchOS 10.6 or later."
    - q: "Which devices are supported?"
      a: "iPhone with iOS 17 or later and Apple Watch with watchOS 10.6 or later."
    - q: "What’s included in Brushio Pro?"
      a: "The “Dental Arch” brushing mode, more brushing duration options, unlimited extra sessions, statistics for 6 months and a year, photos of dentist visit documents, extra toothbrush replacement periods and the PDF report. You can subscribe monthly (with the first 3 days free) or yearly, or buy it once for lifetime access."
    - q: "How do I cancel Brushio Pro?"
      a: "Open Settings on your iPhone, tap your name, then Subscriptions, and choose Brushio. A lifetime purchase never needs to be canceled."
    - q: "Which languages does Brushio speak?"
      a: "English, Ukrainian, Russian, German, French, Spanish, Brazilian Portuguese, Japanese and Simplified Chinese."
    - q: "How can I contact you?"
      a: "Write to brushio.support@gmail.com - we read every message."

footer:
  privacy: "Privacy Policy"
  terms: "Terms of Use"
  support: "Support"

