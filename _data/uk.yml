# ---------------------------------------------------------------------------
# Тексты главной (/uk/). Раздел называется v1 - по макету «вариант 1» из
# Claude Design. В строках можно HTML: <br>, <span class="...">.
# ---------------------------------------------------------------------------
v1:
  nav:
    label: "Головне меню"
    features: "Функції"
    faq: "Питання"
    support: "Підтримка"
    download: "Завантажити"

  hero:
    eyebrow: "Brushio для iPhone і Apple Watch"
    headline: "Чистіть зуби правильно"
    headline_muted: "так, як радять стоматологи."
    lead: "Brushio веде вас по всіх зонах поверхні зубів під час чистки, памʼятає всі деталі візитів до стоматолога і стежить за станом вашої зубної щітки."
    # Три телефони першого екрана (імена файлів зі screens/<мова>/).
    screen_left: dentistDetail
    alt_left: "Деталі візиту до стоматолога в Brushio"
    screen_center: timer-chewing
    alt_center: "Таймер чистки Brushio: зона «Нижні жувальні ліві»"
    screen_right: toothMap
    alt_right: "Карта зубів Brushio у 3D"

  # w - білий, a - бірюзовий, решта - приглушений сірий.
  statement: 'Кожна чистка. <span class="w">Кожен зуб.</span> Кожен візит до стоматолога. <span class="a">Усе в одному застосунку.</span>'

  rows:
    - kicker: "Таймер"
      title: "Шістнадцять зон.<br>Уся поверхня зубів."
      text: "Таймер ділить зуби на 16 зон - зовнішні, внутрішні й жувальні поверхні - і веде вас по черзі. Для кожної зони - підказка, як тримати й рухати щітку: ручну, електричну чи звукову. Вібрація і звук підкажуть, коли переходити до наступної."
      # Групи міток. Мітка - рядок або {name, pro, screen, alt}:
      # pro: true - плашка PRO; screen - мітка стає кнопкою і перемикає скриншот поруч.
      chip_groups:
        - label: "Три режими відображення:"
          chips:
            - name: "3D Щелепа"
              screen: timer
              alt: "Таймер чистки в режимі «3D Щелепа»"
            - name: "Комбо таймер"
              screen: timer2
              alt: "Таймер чистки в режимі «Комбо таймер»"
            - name: "Зубна дуга"
              screen: timer3
              alt: "Таймер чистки в режимі «Зубна дуга»"
              pro: true
      screen: timer
      alt: "Таймер чистки з 3D-щелепою"
    # «Дантист» - як вкладка в застосунку (на решті сайту - «стоматолог»).
    - kicker: "Дантист"
      title: "Кожен візит - під рукою."
      text: "Записуйте огляди й лікування: діагноз, процедуру, клініку з адресою, вартість і нотатки. А Brushio підсумує і нагадає, коли настане час наступного огляду."
      chips:
        - "Огляди"
        - "Лікування"
        - "Вартість"
        - name: "Фото документів"
          pro: true
      screen: dentistDetail
      alt: "Деталі візиту: діагностовані зуби, вартість, клініка"
    - kicker: "Карта зубів"
      title: "Кожен зуб має свою історію."
      text: "Торкніться зуба на 3D-моделі - і побачите все, що з ним відбувалося: діагнози, пломби, коронки, видалення. Зуби з діагнозом чи лікуванням виділені кольором, тож проблемні місця видно одразу."
      screen: toothMap
      alt: "Карта зубів у 3D з історією лікування"
    # dot - кольорова точка на мітці (кольори як у легенді календаря застосунку).
    - kicker: "Календар"
      title: "Увесь місяць - з одного погляду."
      text: "Кольорові позначки показують ранкові й вечірні чистки, додаткові сеанси, візити до стоматолога і симптоми. Торкніться дня - і побачите, коли і скільки ви чистили зуби. Відчули біль чи кровоточивість ясен? Додайте симптом, щоб не забути розповісти про нього стоматологу на наступному візиті."
      chips:
        - name: "Ранок"
          dot: "#FFD64F"
        - name: "Вечір"
          dot: "#4A9EFF"
        - name: "Екстра"
          dot: "#A68CFA"
        - name: "Дантист"
          dot: "#FF6B8A"
        - name: "Симптом"
          dot: "#FF9F0A"
      screen: calendar
      alt: "Календар чисток, візитів і симптомів"
    - kicker: "Статистика"
      title: "Серії, які хочеться продовжувати."
      text: "Поточна й найдовша серія, чистки за останній тиждень, відсоток чищення кожної зони, загальний час, кількість сеансів і відмінних чисток - уся статистика перед очима."
      text2: "А ще - підсумки візитів до стоматолога і 20 досягнень, які мотивують не переривати серію."
      chips:
        - "Серії"
        - "Покриття зон"
        - "Досягнення"
        - "Статистика за різні періоди"
      screen: statistic
      alt: "Статистика: серії, активність за тиждень, покриття зон"
    - kicker: "Зубна щітка"
      title: "Щітка завжди в гарній формі."
      text: "Brushio запам’ятовує тип і бренд вашої щітки та рахує дні використання - адже зношена щетина гірше чистить і накопичує бактерії. Застосунок збереже історію всіх ваших щіток і може завчасно нагадати придбати нову."
      screen: toothbrush
      alt: "Екран «Моя щітка»: 43 з 90 днів"

  platforms:
    title: "Не лише на iPhone."
    title_muted: "Apple Watch, віджети, iCloud і Здоровʼя."
    items:
      - icon: watch
        title: "Apple Watch"
        text: "Таймер із підказками зон і вібрацією на зап’ясті, а серія і чистки за тиждень - прямо на циферблаті."
      - icon: widgets
        title: "Віджети"
        text: "Серія, активність за тиждень і стан щітки - на головному екрані та екрані блокування."
      - icon: live
        title: "Live Activity"
        text: "Хід чистки на екрані блокування і в Dynamic Island."
      - icon: cloud
        title: "iCloud"
        text: "Дані зберігаються у вашому iCloud, тож нічого не загубиться при зміні телефона."
      - icon: health
        title: "Apple Health"
        text: "Чистки записуються у «Здоровʼя»."
      - icon: doc
        title: "PDF-звіт"
        pro: true
        text: "Поділіться зі стоматологом симптомами, історією лікування і статистикою чисток у вигляді зручного PDF-документа."

  final: "Зробіть крок до здорових зубів"
  social: "Слідкуйте за Brushio у соцмережах"

  footer:
    label: "Посилання в підвалі"
    rights: "© 2026 Brushio. Зроблено в Україні."

# ---------------------------------------------------------------------------
# Сторінка підтримки (/uk/support/). «Налаштування» - вкладка в Brushio,
# «Параметри» - системний застосунок iPhone (так в українській iOS).
# ---------------------------------------------------------------------------
support:
  heading: "Підтримка"
  lead: "Маєте питання чи щось не працює? Напишіть нам - ми читаємо кожен лист."
  button: "Написати нам"
  details_title: "Щоб ми швидше допомогли, додайте до листа:"
  details:
    - "модель iPhone або Apple Watch і версію iOS / watchOS;"
    - "версію Brushio (Налаштування → Про додаток → Версія);"
    - "що сталося і як це повторити;"
    - "знімок екрана, якщо можна."
  faq_title: "Часті проблеми"
  faq:
    - q: "Дані не синхронізуються між пристроями"
      a: "Відкрийте Налаштування → Про додаток → Синхронізація iCloud: там видно стан синхронізації. Якщо є помилка, торкніться рядка - Brushio покаже причину. Перевірте, що на всіх пристроях виконано вхід в один і той самий Apple Account, сховище iCloud не заповнене і є інтернет."
    - q: "Як відновити покупку Brushio Pro"
      a: "Відкрийте Налаштування → Brushio Pro і торкніться «Відновити». Використовуйте той самий Apple Account, з якого купували."
    - q: "Не приходять нагадування"
      a: "Перевірте, що нагадування увімкнені в Налаштування → Нагадування → Керування нагадуваннями, а в Параметрах iPhone → Сповіщення → Brushio дозволені сповіщення. Режим фокусування теж може їх приховувати."
    - q: "Чистки не зʼявляються в «Здоровʼї»"
      a: "Увімкніть Apple Health в Налаштування → Параметри. Потім у застосунку «Здоровʼя» відкрийте свій профіль і перевірте, що Brushio має доступ. Brushio лише записує чистки і нічого не читає."
    - q: "Як змінити мову застосунку"
      a: "Налаштування → Параметри → Мова - відкриються Параметри iPhone, де можна вибрати мову саме для Brushio."
    - q: "Як скасувати підписку"
      a: "Параметри iPhone → ваше імʼя → Підписки → Brushio. Покупку «Назавжди» скасовувати не потрібно."
    - q: "Як видалити всі дані"
      a: "Окремі записи можна видалити в застосунку. Щоб видалити все, видаліть Brushio з iPhone, а потім його дані з iCloud: Параметри → ваше імʼя → iCloud → Керувати сховищем → Brushio."
  more_before: "Більше відповідей - у розділі"
  more_link: "«Питання»"
  more_after: "на головній."
