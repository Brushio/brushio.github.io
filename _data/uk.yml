# Тексты лендинга на украинском - рабочий язык для согласования.
# Термины взяты из локализации приложения (Localizable.xcstrings).
# В текстах - короткий дефис «-», не длинное тире.

language_name: "Українська"

meta:
  title: "Brushio - розумний таймер чищення та догляд за зубами"
  description: "Чистіть зуби правильно з покроковим таймером, тримайте серію, зберігайте історію візитів до стоматолога для кожного зуба та знайте, коли міняти щітку. Для iPhone і Apple Watch."

app_store_button: "Завантажити в App Store"

faq:
  title: "Питання та відповіді"
  items:
    - q: "Чи потрібен обліковий запис?"
      a: "Ні. Brushio працює без реєстрації. Ваші дані привʼязані до облікового запису Apple через iCloud, яким ви вже користуєтеся."
    - q: "Де зберігаються мої дані?"
      a: "На ваших пристроях і у вашому приватному iCloud. У Brushio немає серверів, тому розробник не має доступу до ваших даних."
    - q: "Що Brushio робить з Apple Health?"
      a: "Лише записує ваші чищення зубів в Apple Health, якщо ви це дозволите. Дані про здоровʼя застосунок ніколи не читає."
    - q: "Чи працює він на Apple Watch?"
      a: "Так. Почати чищення і стежити за ним можна просто з годинника. Потрібен watchOS 10.6 або новіший."
    - q: "Які пристрої підтримуються?"
      a: "iPhone з iOS 17 або новішою та Apple Watch з watchOS 10.6 або новішою."
    - q: "Що входить у Brushio Pro?"
      a: "Режим чищення «Зубна дуга», більше варіантів тривалості чистки, необмежені додаткові сеанси, статистика за пів року й рік, фото документів візиту до стоматолога, додаткові періоди заміни щітки і PDF-звіт. Pro можна оформити помісячно (перші 3 дні безкоштовно), на рік або купити назавжди одним платежем."
    - q: "Як скасувати Brushio Pro?"
      a: "Відкрийте Параметри на iPhone, натисніть на своє імʼя, потім «Підписки» і оберіть Brushio. Покупку «Назавжди» скасовувати не потрібно."
    - q: "Якими мовами доступний Brushio?"
      a: "Українська, англійська, російська, німецька, французька, іспанська, бразильська португальська, японська та спрощена китайська."
    - q: "Як звʼязатися з вами?"
      a: "Пишіть на brushio.support@gmail.com - ми читаємо кожен лист."

footer:
  privacy: "Політика конфіденційності"
  terms: "Умови використання"
  support: "Підтримка"

